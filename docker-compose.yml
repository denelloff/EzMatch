# eZ-Match local dependencies (MariaDB).
services:
  mariadb:
    image: mariadb:11.4
    container_name: ppanel-mariadb
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpw}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-ppanel}
      MARIADB_USER: ${MARIADB_USER:-ppanel}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-ppanel}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Raw log lines and JSON payloads make rows wide; the default 4k limit is
      # reached quickly once several TEXT columns are populated.
      - --innodb-default-row-format=dynamic
    ports:
      - '${MARIADB_PORT:-3306}:3306'
    volumes:
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mariadb-data:

