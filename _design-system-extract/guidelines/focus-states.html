<!-- @dsCard group="Spacing" viewport="700x140" name="Focus & interaction" subtitle="Hover, focus ring, active, disabled" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--bg-app);font:var(--type-body);color:var(--text-body)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:var(--radius-md);border:1px solid var(--border-1);overflow:hidden}.sw i{display:block;height:44px}.sw b{display:block;padding:5px 8px;font:var(--type-small);font-size:var(--text-3xs);font-weight:var(--weight-medium);color:var(--text-body)}.sw u{display:block;padding:0 8px 6px;font-family:var(--font-mono);font-size:9px;color:var(--text-faint);text-decoration:none}</style></head><body><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
<span style="display:inline-flex;height:36px;align-items:center;padding:0 16px;border-radius:var(--radius-md);background:var(--brand-500);color:var(--text-on-brand);font-weight:600;font-size:14px">default</span>
<span style="display:inline-flex;height:36px;align-items:center;padding:0 16px;border-radius:var(--radius-md);background:var(--brand-600);color:var(--text-on-brand);font-weight:600;font-size:14px">hover</span>
<span style="display:inline-flex;height:36px;align-items:center;padding:0 16px;border-radius:var(--radius-md);background:var(--brand-500);color:var(--text-on-brand);font-weight:600;font-size:14px;box-shadow:var(--ring-focus)">focus</span>
<span style="display:inline-flex;height:36px;align-items:center;padding:0 16px;border-radius:var(--radius-md);background:var(--brand-500);color:var(--text-on-brand);font-weight:600;font-size:14px;opacity:.6">disabled</span>
<input style="height:36px;border-radius:var(--radius-md);border:1px solid var(--brand-500);background:var(--surface-2);color:var(--text-strong);padding:0 12px;box-shadow:var(--ring-focus);font:var(--type-body)" value="focused input">
</div></body></html>
