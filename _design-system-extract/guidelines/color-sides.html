<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:18px;background:var(--bg-app);font:var(--type-body);color:var(--text-body)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{flex:1;min-width:0;border-radius:var(--radius-md);border:1px solid var(--border-1);overflow:hidden}.sw i{display:block;height:44px}.sw b{display:block;padding:5px 8px;font:var(--type-small);font-size:var(--text-3xs);font-weight:var(--weight-medium);color:var(--text-body)}.sw u{display:block;padding:0 8px 6px;font-family:var(--font-mono);font-size:9px;color:var(--text-faint);text-decoration:none}</style></head><body><div class="g">
<div class="sw"><i style="background:var(--side-ct)"></i><b>side-ct</b><u>#4aa8ff</u></div><div class="sw"><i style="background:var(--side-ct-wash)"></i><b>side-ct-wash</b><u>rgba(74,168,255,.15)</u></div><div class="sw"><i style="background:var(--side-t)"></i><b>side-t</b><u>#f0a92c</u></div><div class="sw"><i style="background:var(--side-t-wash)"></i><b>side-t-wash</b><u>rgba(240,169,44,.15)</u></div></div>
<p style="margin:10px 0 0;font:var(--type-small);color:var(--text-faint)">Scoreboard blocks tint their header with the wash and set the team name in the solid colour.</p></body></html>
