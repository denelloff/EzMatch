<span style="padding:var(--space-4) var(--space-6);font-size:var(--text-sm);color:var(--text-faint)">Match statistics</span>
<span style="padding:var(--space-4) var(--space-6);font-size:var(--text-sm);color:var(--text-faint)">Player statistics</span>
<span style="padding:var(--space-4) var(--space-6);font-size:var(--text-sm);color:var(--text-faint)">Weapon statistics</span>
<span style="padding:var(--space-4) var(--space-6);font-size:var(--text-sm);color:var(--text-faint)">Demos</span>
</div>
